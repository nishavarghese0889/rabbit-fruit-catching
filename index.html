<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Fruit Catch</title>
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================== GAME CONTAINER ==================== */
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 40%, #90EE90 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* ==================== BACKGROUND DECORATIONS ==================== */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: floatCloud 20s infinite linear;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 80px;
            height: 30px;
            top: 50px;
            left: -100px;
        }

        .cloud1::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 10px;
        }

        .cloud1::after {
            width: 50px;
            height: 35px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 100px;
            height: 35px;
            top: 100px;
            left: -150px;
            animation-delay: -10s;
        }

        .cloud2::before {
            width: 50px;
            height: 45px;
            top: -22px;
            left: 15px;
        }

        .cloud2::after {
            width: 60px;
            height: 40px;
            top: -18px;
            right: 15px;
        }

        @keyframes floatCloud {
            from { transform: translateX(0); }
            to { transform: translateX(900px); }
        }

        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, #90EE90, #228B22);
            border-top: 3px solid #7CB342;
        }

        /* ==================== START SCREEN ==================== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #startScreen h1 {
            font-size: 4em;
            color: #FF6B9D;
            text-shadow: 4px 4px 0 #FFB6C1, 6px 6px 0 #FFC0CB;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .bunnyIcon {
            font-size: 5em;
            margin: 20px;
            animation: wiggle 1s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .instructions {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin: 20px;
            text-align: center;
        }

        .instructions h3 {
            color: #FF6B9D;
            margin-bottom: 15px;
        }

        .instructions p {
            margin: 8px 0;
            color: #555;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #FF6B9D, #FFB6C1);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* ==================== HUD (Score, Lives, Level) ==================== */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            z-index: 100;
        }

        .hudItem {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 1.2em;
        }

        .hudLabel {
            color: #FF6B9D;
            margin-right: 5px;
        }

        .hudValue {
            color: #333;
        }

        /* ==================== GAME CANVAS ==================== */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ==================== GAME OVER SCREEN ==================== */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #gameOverScreen h2 {
            font-size: 4em;
            color: #FF6B9D;
            text-shadow: 3px 3px 0 #FFB6C1;
            margin-bottom: 20px;
        }

        #finalScore {
            font-size: 2em;
            color: white;
            margin: 20px;
        }

        #highScoreDisplay {
            font-size: 1.5em;
            color: #FFD700;
            margin: 10px;
        }

        /* ==================== PAUSE SCREEN ==================== */
        #pauseScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
        }

        #pauseScreen h2 {
            font-size: 3em;
            color: white;
            margin-bottom: 20px;
        }

        /* ==================== COMBO DISPLAY ==================== */
        #comboDisplay {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2em;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: none;
            z-index: 200;
            animation: comboPopIn 0.3s;
        }

        @keyframes comboPopIn {
            0% { transform: translateX(-50%) scale(0); }
            50% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* ==================== RESPONSIVE DESIGN ==================== */
        @media (max-width: 768px) {
            #gameContainer {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            #startScreen h1 {
                font-size: 2.5em;
            }

            .hudItem {
                padding: 8px 15px;
                font-size: 1em;
            }
        }

        /* ==================== MOBILE CONTROLS ==================== */
        #mobileControls {
            position: absolute;
            bottom: 120px;
            left: 0;
            right: 0;
            display: none;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        .mobileBtn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #FF6B9D;
            border-radius: 50%;
            font-size: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .mobileBtn:active {
            background: rgba(255, 107, 157, 0.8);
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            #mobileControls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== GAME CONTAINER ==================== -->
    <div id="gameContainer">
        <!-- Background Decorations -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="grass"></div>

        <!-- Start Screen -->
        <div id="startScreen">
            <h1>🐰 Bunny Fruit Catch 🍎</h1>
            <div class="bunnyIcon">🐰</div>
            <div class="instructions">
                <h3>How to Play</h3>
                <p>🎮 Use ← → Arrow Keys to move</p>
                <p>🍓 Catch falling fruits to score points</p>
                <p>❤️ Don't miss 3 fruits or it's game over!</p>
                <p>⏸️ Press P to pause</p>
                <p>🎯 Every 10 points = New Level!</p>
            </div>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="hudItem">
                <span class="hudLabel">Score:</span>
                <span class="hudValue" id="scoreDisplay">0</span>
            </div>
            <div class="hudItem">
                <span class="hudLabel">Level:</span>
                <span class="hudValue" id="levelDisplay">1</span>
            </div>
            <div class="hudItem">
                <span class="hudLabel">Lives:</span>
                <span class="hudValue" id="livesDisplay">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Combo Display -->
        <div id="comboDisplay"></div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Pause Screen -->
        <div id="pauseScreen">
            <h2>⏸️ PAUSED</h2>
            <p style="color: white; font-size: 1.2em;">Press P to resume</p>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div id="finalScore"></div>
            <div id="highScoreDisplay"></div>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>

        <!-- Mobile Controls -->
        <div id="mobileControls">
            <div class="mobileBtn" id="leftBtn">◀️</div>
            <div class="mobileBtn" id="rightBtn">▶️</div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ==================== GAME VARIABLES ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameState = 'start'; // 'start', 'playing', 'paused', 'gameOver'
        let score = 0;
        let level = 1;
        let lives = 3;
        let combo = 0;
        let highScore = localStorage.getItem('bunnyHighScore') || 0;

        // Player (Rabbit)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 60,
            height: 60,
            speed: 5,
            basketWidth: 80,
            basketHeight: 40
        };

        // Fruits array
        let fruits = [];
        let particles = [];

        // Fruit types with different points
        const fruitTypes = [
            { emoji: '🍎', points: 10, color: '#FF6B6B' },
            { emoji: '🍊', points: 15, color: '#FFA500' },
            { emoji: '🍇', points: 20, color: '#9370DB' },
            { emoji: '🍓', points: 12, color: '#FF69B4' },
            { emoji: '🍌', points: 8, color: '#FFD700' },
            { emoji: '🍉', points: 25, color: '#FF6347' }
        ];

        // Game timing
        let lastFruitSpawn = 0;
        let spawnInterval = 1500; // milliseconds
        let fruitSpeed = 2;

        // Input handling
        const keys = {};
        let mobileLeft = false;
        let mobileRight = false;

        // ==================== AUDIO SETUP ====================
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playCatchSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function playGameOverSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 200;
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playLevelUpSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
            oscillator.type = 'triangle';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // ==================== INPUT HANDLING ====================
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // Pause functionality
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing') {
                    pauseGame();
                } else if (gameState === 'paused') {
                    resumeGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mobile controls
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            mobileLeft = true;
        });

        document.getElementById('leftBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            mobileLeft = false;
        });

        document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            mobileRight = true;
        });

        document.getElementById('rightBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            mobileRight = false;
        });

        // ==================== GAME FUNCTIONS ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState = 'playing';
            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            level = 1;
            lives = 3;
            combo = 0;
            fruits = [];
            particles = [];
            player.x = canvas.width / 2;
            spawnInterval = 1500;
            fruitSpeed = 2;
            updateHUD();
        }

        function pauseGame() {
            gameState = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
        }

        function resumeGame() {
            gameState = 'playing';
            document.getElementById('pauseScreen').style.display = 'none';
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'gameOver';
            playGameOverSound();
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bunnyHighScore', highScore);
            }
            
            document.getElementById('finalScore').innerHTML = `Final Score: ${score}<br>Level Reached: ${level}`;
            document.getElementById('highScoreDisplay').textContent = `🏆 High Score: ${highScore}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            gameState = 'playing';
            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            
            let heartsDisplay = '';
            for (let i = 0; i < lives; i++) {
                heartsDisplay += '❤️';
            }
            for (let i = lives; i < 3; i++) {
                heartsDisplay += '🖤';
            }
            document.getElementById('livesDisplay').textContent = heartsDisplay;
        }

        // ==================== PLAYER MOVEMENT ====================
        function updatePlayer() {
            // Keyboard controls
            if (keys['ArrowLeft'] || mobileLeft) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || mobileRight) {
                player.x += player.speed;
            }

            // Boundary check
            if (player.x < player.width / 2) {
                player.x = player.width / 2;
            }
            if (player.x > canvas.width - player.width / 2) {
                player.x = canvas.width - player.width / 2;
            }
        }

        // ==================== FRUIT SPAWNING ====================
        function spawnFruit(timestamp) {
            if (timestamp - lastFruitSpawn > spawnInterval) {
                const fruitType = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                const fruit = {
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -40,
                    width: 40,
                    height: 40,
                    speed: fruitSpeed,
                    type: fruitType
                };
                fruits.push(fruit);
                lastFruitSpawn = timestamp;
            }
        }

        // ==================== FRUIT UPDATE ====================
        function updateFruits() {
            for (let i = fruits.length - 1; i >= 0; i--) {
                fruits[i].y += fruits[i].speed;

                // Check collision with basket
                if (checkCollision(fruits[i])) {
                    // Fruit caught!
                    score += fruits[i].type.points;
                    combo++;
                    
                    // Create particles
                    createParticles(fruits[i].x, fruits[i].y, fruits[i].type.color);
                    
                    playCatchSound();
                    
                    // Show combo
                    if (combo > 1) {
                        showCombo();
                    }
                    
                    // Level up every 10 points
                    const newLevel = Math.floor(score / 100) + 1;
                    if (newLevel > level) {
                        level = newLevel;
                        fruitSpeed += 0.5;
                        spawnInterval = Math.max(800, spawnInterval - 100);
                        playLevelUpSound();
                    }
                    
                    updateHUD();
                    fruits.splice(i, 1);
                } 
                // Fruit missed
                else if (fruits[i].y > canvas.height) {
                    lives--;
                    combo = 0; // Reset combo on miss
                    updateHUD();
                    fruits.splice(i, 1);
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }
        }

        // ==================== COLLISION DETECTION ====================
        function checkCollision(fruit) {
            const basketLeft = player.x - player.basketWidth / 2;
            const basketRight = player.x + player.basketWidth / 2;
            const basketTop = player.y;
            const basketBottom = player.y + player.basketHeight;

            return (
                fruit.x + fruit.width / 2 > basketLeft &&
                fruit.x - fruit.width / 2 < basketRight &&
                fruit.y + fruit.height / 2 > basketTop &&
                fruit.y - fruit.height / 2 < basketBottom
            );
        }

        // ==================== PARTICLE EFFECTS ====================
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 1,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].vy += 0.2; // gravity
                particles[i].life -= 0.02;

                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ==================== COMBO DISPLAY ====================
        function showCombo() {
            const comboDisplay = document.getElementById('comboDisplay');
            const multiplier = Math.min(combo, 5); // Max 5x multiplier
            comboDisplay.textContent = `${combo}x COMBO! 🔥`;
            comboDisplay.style.display = 'block';
            
            setTimeout(() => {
                comboDisplay.style.display = 'none';
            }, 1000);
        }

        // ==================== RENDERING ====================
        function drawPlayer() {
            const basketLeft = player.x - player.basketWidth / 2;
            const basketRight = player.x + player.basketWidth / 2;
            const basketTop = player.y;
            const basketBottom = player.y + player.basketHeight;
            
            // Draw basket shadow for depth
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.ellipse(player.x, basketBottom + 5, player.basketWidth / 2 - 5, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Draw basket main body with gradient
            const basketGradient = ctx.createLinearGradient(basketLeft, basketTop, basketRight, basketTop);
            basketGradient.addColorStop(0, '#6B4423');
            basketGradient.addColorStop(0.5, '#8B6914');
            basketGradient.addColorStop(1, '#6B4423');
            
            // Basket outer shape
            ctx.fillStyle = basketGradient;
            ctx.beginPath();
            ctx.moveTo(basketLeft, basketTop);
            ctx.lineTo(basketRight, basketTop);
            ctx.lineTo(basketRight - 10, basketBottom);
            ctx.lineTo(basketLeft + 10, basketBottom);
            ctx.closePath();
            ctx.fill();

            // Add darker outline
            ctx.strokeStyle = '#4A2511';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw woven basket texture - vertical strips
            ctx.strokeStyle = '#5D3A1A';
            ctx.lineWidth = 4;
            for (let i = 0; i < 6; i++) {
                const x = basketLeft + (i * (player.basketWidth / 5));
                const topX = x;
                const bottomX = basketLeft + 10 + (i * ((player.basketWidth - 20) / 5));
                
                ctx.beginPath();
                ctx.moveTo(topX, basketTop);
                ctx.lineTo(bottomX, basketBottom);
                ctx.stroke();
            }

            // Draw woven basket texture - horizontal strips
            ctx.strokeStyle = '#7A5230';
            ctx.lineWidth = 3;
            for (let i = 1; i < 5; i++) {
                const y = basketTop + (i * (player.basketHeight / 5));
                const leftX = basketLeft + ((basketBottom - y) / player.basketHeight) * 10;
                const rightX = basketRight - ((basketBottom - y) / player.basketHeight) * 10;
                
                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
            }

            // Draw basket rim (top edge highlight)
            ctx.strokeStyle = '#A0826D';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(basketLeft, basketTop);
            ctx.lineTo(basketRight, basketTop);
            ctx.stroke();

            // Add basket inner shadow for depth
            const innerGradient = ctx.createLinearGradient(player.x, basketTop, player.x, basketTop + 15);
            innerGradient.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
            innerGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = innerGradient;
            ctx.beginPath();
            ctx.moveTo(basketLeft + 2, basketTop);
            ctx.lineTo(basketRight - 2, basketTop);
            ctx.lineTo(basketRight - 8, basketTop + 15);
            ctx.lineTo(basketLeft + 8, basketTop + 15);
            ctx.closePath();
            ctx.fill();

            // Draw basket bottom (inside view)
            ctx.fillStyle = '#4A2511';
            ctx.beginPath();
            ctx.ellipse(player.x, basketBottom - 5, (player.basketWidth / 2) - 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Add highlights on the weave for realism
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const x = basketLeft + 2 + (i * (player.basketWidth / 5));
                const topX = x;
                const bottomX = basketLeft + 12 + (i * ((player.basketWidth - 20) / 5));
                
                ctx.beginPath();
                ctx.moveTo(topX, basketTop);
                ctx.lineTo(bottomX, basketBottom);
                ctx.stroke();
            }

            // Draw rabbit (emoji)
            ctx.font = `${player.width}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('🐰', player.x, player.y + player.basketHeight - 10);
        }

        function drawFruits() {
            fruits.forEach(fruit => {
                ctx.font = `${fruit.width}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(fruit.type.emoji, fruit.x, fruit.y);
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        // ==================== GAME LOOP ====================
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
            if (gameState !== 'playing') {
                return;
            }

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update game objects
            updatePlayer();
            spawnFruit(timestamp);
            updateFruits();
            updateParticles();

            // Draw everything
            drawParticles();
            drawFruits();
            drawPlayer();

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // ==================== INITIALIZE ====================
        // Display high score on start screen
        if (highScore > 0) {
            const highScoreDiv = document.createElement('div');
            highScoreDiv.style.color = '#FFD700';
            highScoreDiv.style.fontSize = '1.2em';
            highScoreDiv.style.marginTop = '10px';
            highScoreDiv.textContent = `🏆 High Score: ${highScore}`;
            document.querySelector('.instructions').appendChild(highScoreDiv);
        }
    </script>
</body>
</html>
